name: Funktion vorschlagen
description: Eine neue Funktion oder Verbesserung vorschlagen
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Bitte keine Athlete ID, Tokens oder andere persönliche Daten veröffentlichen.
  - type: textarea
    id: problem
    attributes:
      label: Problem oder Bedarf
      description: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
      description: Wie sollte sich PaceKeeper verhalten?
    validations:
      required: true
