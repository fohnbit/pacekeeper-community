name: Fehler melden
description: Einen reproduzierbaren Fehler in PaceKeeper melden
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Bitte keine Athlete ID, Tokens oder andere persönliche Daten veröffentlichen.
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      description: Mit welchen Schritten tritt der Fehler auf?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PaceKeeper-Version
  - type: input
    id: platform
    attributes:
      label: Plattform
      placeholder: iOS, iPadOS, Web oder Server
